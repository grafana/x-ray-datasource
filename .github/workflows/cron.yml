name: Scheduled Cloud E2E tests

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  playwright-cloud:
    uses: grafana/data-sources-ci-workflows/.github/workflows/playwright-cloud.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      run-stage: nightly
      # Bench runs each command without a shell, so use ';' to separate them.
      bench-prepare-cmd: npm ci; npx playwright install chromium
      # Bench appends its own '-- --reporter=json <suite-path>', so the tag
      # filter has to live in the script rather than in extra args here.
      bench-execute-cmd: npm run e2e:cloud
      repo-secrets: |
        AWS_ACCESS_KEY_ID=xray:secure_accessKey
        AWS_SECRET_ACCESS_KEY=xray:secure_secretKey
        AWS_DEFAULT_REGION=xray:json_defaultRegion

  notify-slack:
    name: Notify Slack on failure
    needs: playwright-cloud
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The shared action authenticates to Slack over OIDC.
      id-token: write
    steps:
      - name: Notify Slack on failure
        uses: grafana/data-sources-ci-workflows/.github/actions/notify-cloud-e2e-failure@main
        with:
          repo: ${{ github.repository }}
          run-stage: nightly
          ref-name: ${{ github.ref_name }}
          actor: ${{ github.actor }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
