name: Scheduled Cloud E2E tests

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  playwright-cloud:
    uses: grafana/data-sources-ci-workflows/.github/workflows/playwright-cloud.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      run-stage: nightly
      # Bench runs each command without a shell, so use ';' to separate them.
      bench-prepare-cmd: npm ci; npx playwright install chromium
      # Bench appends its own '-- --reporter=json <suite-path>', so the tag
      # filter has to live in the script rather than in extra args here.
      bench-execute-cmd: npm run e2e:cloud
      repo-secrets: |
        AWS_ACCESS_KEY_ID=xray:secure_accessKey
        AWS_SECRET_ACCESS_KEY=xray:secure_secretKey
        AWS_DEFAULT_REGION=xray:json_defaultRegion
