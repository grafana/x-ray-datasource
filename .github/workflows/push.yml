name: Plugins - CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.1.0
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      playwright-config: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'playwright.smoke.config.ts' || 'playwright.config.ts' }}
      playwright-secrets: |
        AWS_ACCESS_KEY_ID=xray:secure_accessKey
        AWS_SECRET_ACCESS_KEY=xray:secure_secretKey
        AWS_DEFAULT_REGION=xray:json_defaultRegion

  publish-and-deploy:
    if: github.ref == 'refs/heads/main'
    uses: grafana/data-sources-ci-workflows/.github/workflows/cd-dev.yml@b400d490687700082808b90d2200239a820b3186 # main
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    with:
      go-version: '1.26.3'
      golangci-lint-version: '2.12.2'
